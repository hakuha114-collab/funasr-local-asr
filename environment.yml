# FunASR conda 环境（离线 diarize.py / Python API 路线，与"以前 conda 执行"一致）
# 创建:  conda env create -f environment.yml
# 激活:  conda activate funasr
# 验证:  python -c "import funasr, torch; print(funasr.__version__)"
# 说明:
#   - 最新 funasr = 1.3.30（2026-07-27），说话人分离用 cam++，用法见 diarize.py
#   - ffmpeg 用于处理 mp4 等非 wav 音频（conda-forge 提供）
#   - 纯 CPU 可跑 Paraformer + cam++；有 NVIDIA GPU 时把 diarize.py 的 --device 改为 cuda 更快
#   - 本地 WS 服务(funasr_local_server)需要 websockets + scipy（服务脚本已随仓库附带）
name: funasr
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - ffmpeg
  - pip:
      - torch
      - torchaudio
      - "funasr==1.3.30"
      - modelscope
      - onnxruntime
      - soundfile
      - scipy
      - websockets
      - fastapi
      - uvicorn
      - python-multipart
